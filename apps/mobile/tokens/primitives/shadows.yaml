primitives:
  shadows:
    none:
      shadowColor: "transparent"
      shadowOffset:
        width: 0
        height: 0
      shadowOpacity: 0
      shadowRadius: 0
      elevation: 0
    xs:
      shadowColor: "#000"
      shadowOffset:
        width: 0
        height: 1
      shadowOpacity: 0.04
      shadowRadius: 2
      elevation: 1
    sm:
      shadowColor: "#000"
      shadowOffset:
        width: 0
        height: 2
      shadowOpacity: 0.06
      shadowRadius: 4
      elevation: 2
    md:
      shadowColor: "#000"
      shadowOffset:
        width: 0
        height: 4
      shadowOpacity: 0.08
      shadowRadius: 8
      elevation: 4
    lg:
      shadowColor: "#000"
      shadowOffset:
        width: 0
        height: 8
      shadowOpacity: 0.1
      shadowRadius: 16
      elevation: 8
    xl:
      shadowColor: "#000"
      shadowOffset:
        width: 0
        height: 12
      shadowOpacity: 0.12
      shadowRadius: 24
      elevation: 12
