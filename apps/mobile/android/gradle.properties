# Project-wide Gradle settings.

org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseG1GC
org.gradle.parallel=false
org.gradle.daemon=true
org.gradle.configureondemand=false
org.gradle.configuration-cache=false

android.useAndroidX=true
android.enableJetifier=true

reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

newArchEnabled=true
hermesEnabled=true

# Release signing config (secrets via env vars XUNO_KEYSTORE_PASSWORD, XUNO_KEY_PASSWORD)
RELEASE_STORE_FILE=xuno-release.keystore
RELEASE_KEY_ALIAS=xuno
