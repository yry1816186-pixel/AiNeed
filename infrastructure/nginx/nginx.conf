upstream backend {
  server backend:3001;
}

upstream ai_service {
  server ai-service:8002;
}

upstream minio_api {
  server minio:9000;
}

# HTTP -> HTTPS redirect
server {
  listen 80;
  server_name _;

  # Let's Encrypt challenge
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  return 301 https://$host$request_uri;
}

# HTTPS server
server {
  listen 443 ssl http2;
  server_name _;

  # TLS configuration
  ssl_certificate /etc/letsencrypt/live/xuno.ai/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/xuno.ai/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;
  ssl_prefer_server_ciphers on;

  # SSL session optimization
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;
  ssl_session_tickets off;

  # OCSP stapling (enable after cert is obtained)
  # ssl_stapling on;
  # ssl_stapling_verify on;

  # Security headers
  add_header X-Frame-Options DENY always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';" always;

  # Request size limits
  client_max_body_size 20m;

  # Proxy timeout settings
  proxy_connect_timeout 60s;
  proxy_read_timeout 60s;
  proxy_send_timeout 60s;

  # API proxy -> NestJS backend
  location /api/ {
    proxy_pass http://backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # AI service proxy
  location /ai/ {
    proxy_pass http://ai_service/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Longer timeout for AI inference
    proxy_read_timeout 120s;
  }

  # MinIO object storage proxy
  location /storage/ {
    proxy_pass http://minio_api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Large file upload support
    client_max_body_size 100m;
  }

  # Health check endpoint
  location /health {
    proxy_pass http://backend/health;
    access_log off;
  }

  # Deny access to hidden files
  location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
  }
}
