groups:
  - name: production-critical
    rules:
      - alert: HighErrorRate
        expr: rate(http_requests_total{status_code=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.05
        for: 5m
        labels:
          severity: critical
          team: backend
          service: stylemind-backend
        annotations:
          summary: "API 5xx错误率超过5%"
          description: "当前5xx错误率 {{ $value | humanizePercentage }}"

      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
          team: platform
          service: "{{ $labels.service }}"
          category: availability
        annotations:
          summary: "服务 {{ $labels.instance }} 不可达"
          description: "服务已停止响应超过1分钟"

      - alert: DatabaseConnectionPoolHigh
        expr: db_connections_active > 80
        for: 2m
        labels:
          severity: critical
          team: database
          service: stylemind-postgres
          category: database
        annotations:
          summary: "PostgreSQL连接数过高"
          description: "当前活跃连接数 {{ $value }}"

      - alert: BruteForceDetected
        expr: rate(user_logins_total{method="failed"}[1m]) > 10
        for: 1m
        labels:
          severity: critical
          team: backend
          service: stylemind-backend
          category: security
        annotations:
          summary: "检测到暴力破解攻击"
          description: "登录失败速率 {{ $value }}/s"

      - alert: TryOnServiceDown
        expr: increase(try_on_errors_total[5m]) > 20
        for: 3m
        labels:
          severity: critical
          team: ai
          service: stylemind-ai
          category: availability
        annotations:
          summary: "虚拟试穿服务异常"
          description: "5分钟内试穿错误数 {{ $value }}"

  - name: warning
    rules:
      - alert: HighLatency
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le)) > 2
        for: 5m
        labels:
          severity: warning
          team: backend
          service: stylemind-backend
          category: performance
        annotations:
          summary: "API P95延迟超过2秒"
          description: "当前P95延迟 {{ $value }}s"

      - alert: DiskFull
        expr: node_filesystem_avail_bytes / node_filesystem_size_bytes < 0.2
        for: 5m
        labels:
          severity: warning
          team: platform
          service: stylemind-node-exporter
          category: resource
        annotations:
          summary: "磁盘使用超过80%"

      - alert: HighMemory
        expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) < 0.15
        for: 5m
        labels:
          severity: warning
          team: platform
          service: stylemind-node-exporter
          category: resource
        annotations:
          summary: "可用内存低于15%"

      - alert: AIQuotaExceeded
        expr: rate(ai_quota_exceeded_total[5m]) > 0
        for: 1m
        labels:
          severity: warning
          team: ai
          service: stylemind-ai
          category: cost
        annotations:
          summary: "AI配额超限事件检测"
          description: "检测到AI服务配额超限"

      - alert: RedisMemoryHigh
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.8
        for: 5m
        labels:
          severity: warning
          team: platform
          service: stylemind-redis
          category: resource
        annotations:
          summary: "Redis内存使用超过80%"

      - alert: AIApiLatency
        expr: histogram_quantile(0.95, sum(rate(ai_service_duration_seconds_bucket[5m])) by (le)) > 10
        for: 3m
        labels:
          severity: warning
          team: ai
          service: stylemind-ai
          category: performance
        annotations:
          summary: "AI API P95延迟超过10秒"
          description: "当前P95延迟 {{ $value }}s"

      - alert: TryOnFailureRate
        expr: rate(try_on_errors_total[10m]) / rate(try_on_requests_total[10m]) > 0.1
        for: 5m
        labels:
          severity: warning
          team: ai
          service: stylemind-ai
          category: availability
        annotations:
          summary: "虚拟试穿失败率超过10%"
          description: "当前失败率 {{ $value | humanizePercentage }}"

      - alert: DiskSpaceLow
        expr: node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"} < 0.2
        for: 10m
        labels:
          severity: warning
          team: platform
          service: stylemind-node-exporter
          category: resource
        annotations:
          summary: "磁盘空间不足20%"

      - alert: RedisCacheHitRateLow
        expr: rate(redis_cache_hits_total[5m]) / (rate(redis_cache_hits_total[5m]) + rate(redis_cache_misses_total[5m])) < 0.5
        for: 10m
        labels:
          severity: warning
          team: backend
          service: stylemind-backend
          category: cache
        annotations:
          summary: "Redis缓存命中率低于50%"
          description: "当前命中率 {{ $value | humanizePercentage }}"

      - alert: AIServiceErrorRateHigh
        expr: rate(ai_service_errors_total[5m]) / rate(ai_service_calls_total[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
          team: ai
          service: stylemind-ai
          category: availability
        annotations:
          summary: "AI服务错误率超过5%"
          description: "当前错误率 {{ $value | humanizePercentage }}"

      - alert: PaymentFailureSpike
        expr: increase(payments_failed_total[10m]) > 10
        for: 5m
        labels:
          severity: warning
          team: business
          service: stylemind-backend
          category: business
        annotations:
          summary: "支付失败数异常增长"
          description: "10分钟内失败数 {{ $value }}"
