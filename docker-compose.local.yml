# =============================================================================
# Local Development Full-Stack Docker Compose Configuration
# =============================================================================
# One-command startup: docker compose -f docker-compose.local.yml up --build
#
# Includes: PostgreSQL + Redis + MinIO + Qdrant + AI Service + NestJS Backend
#
# NOTE: Default credentials are for LOCAL DEVELOPMENT ONLY.
# Production deployments MUST use docker-compose.yml with proper secrets.
# =============================================================================

networks:
  localnet:
    driver: bridge

services:
  postgres:
    image: postgres:16-alpine
    container_name: xuno-local-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: xuno
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: xuno
    ports:
      - "5432:5432"
    volumes:
      - local_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xuno"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - localnet
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: xuno-local-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass redis123
    ports:
      - "6379:6379"
    volumes:
      - local_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis123", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - localnet
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: xuno-local-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - local_minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - localnet
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: xuno-local-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - local_qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - localnet
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  minio-init:
    image: minio/mc:RELEASE.2024-11-05T11-29-45Z
    container_name: xuno-local-minio-init
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    networks:
      - localnet
    entrypoint: >
      /bin/sh -c "
      mc alias set xuno-local http://minio:9000 minioadmin minioadmin123;
      mc mb --ignore-existing xuno-local/xuno;
      echo 'MinIO bucket initialized';
      "

  ai-service:
    build:
      context: ./ml
      dockerfile: api/Dockerfile
    container_name: xuno-local-ai
    restart: unless-stopped
    environment:
      AI_SERVICE_HOST: 0.0.0.0
      AI_SERVICE_PORT: 8002
      REDIS_URL: redis://:redis123@redis:6379
      QDRANT_URL: http://qdrant:6333
      GLM_API_KEY: ${GLM_API_KEY:-}
      ZHIPU_API_KEY: ${ZHIPU_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "8002:8002"
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - localnet
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '1'
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: xuno-local-backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://xuno:postgres@postgres:5432/xuno?schema=public
      REDIS_URL: redis://:redis123@redis:6379
      JWT_SECRET: dev-jwt-secret-local-not-for-production
      JWT_REFRESH_SECRET: dev-jwt-refresh-secret-local-not-for-production
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      ENCRYPTION_KEY: dev-encryption-key-local-not-for-production-32chars!
      CSRF_SECRET: dev-csrf-secret-local
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_BUCKET: xuno
      MINIO_USE_SSL: "false"
      QDRANT_URL: http://qdrant:6333
      AI_SERVICE_URL: http://ai-service:8002
      ML_SERVICE_URL: http://ai-service:8002
      GLM_API_KEY: ${GLM_API_KEY:-}
      GLM_API_ENDPOINT: ${GLM_API_ENDPOINT:-https://open.bigmodel.cn/api/paas/v4}
      GLM_MODEL: ${GLM_MODEL:-glm-4-flash}
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - localnet
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  local_postgres_data:
  local_redis_data:
  local_minio_data:
  local_qdrant_data:
